<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="companyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="answerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000018" />
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowIndigo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="520" fill="#f8fafc" rx="16" />

  <!-- ── USER QUESTION ── -->
  <rect x="220" y="28" width="260" height="68" rx="14" fill="url(#userGrad)" filter="url(#shadow)" />
  <text x="350" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#c7d2fe" letter-spacing="1.2">USER INPUT</text>
  <text x="350" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">User's Question</text>

  <!-- Arrow: User → Router -->
  <line x1="350" y1="96" x2="350" y2="158" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)" />

  <!-- ── ROUTER AGENT ── -->
  <rect x="195" y="162" width="310" height="84" rx="14" fill="url(#routerGrad)" filter="url(#shadow)" />
  <text x="350" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#bae6fd" letter-spacing="1.2">STEP 1</text>
  <text x="350" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Router Agent</text>
  <text x="350" y="228" text-anchor="middle" font-size="12" fill="#e0f2fe">Reads question → decides who should answer</text>

  <!-- Branch line down from router center -->
  <line x1="350" y1="246" x2="350" y2="272" stroke="#94a3b8" stroke-width="2" />
  <!-- Horizontal branch line -->
  <line x1="175" y1="272" x2="525" y2="272" stroke="#94a3b8" stroke-width="2" />

  <!-- Left branch label -->
  <rect x="230" y="258" width="108" height="22" rx="6" fill="#dcfce7" />
  <text x="284" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">HR_POLICY</text>

  <!-- Right branch label -->
  <rect x="362" y="258" width="128" height="22" rx="6" fill="#fef3c7" />
  <text x="426" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">COMPANY_INFO</text>

  <!-- Arrow left: → HR Agent -->
  <line x1="175" y1="272" x2="175" y2="314" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)" />
  <!-- Arrow right: → Company Agent -->
  <line x1="525" y1="272" x2="525" y2="314" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowAmber)" />

  <!-- ── HR POLICY AGENT ── -->
  <rect x="48" y="318" width="252" height="92" rx="14" fill="url(#hrGrad)" filter="url(#shadow)" />
  <text x="174" y="342" text-anchor="middle" font-size="11" font-weight="600" fill="#a7f3d0" letter-spacing="1.2">SPECIALIST</text>
  <text x="174" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">HR Policy Agent</text>
  <text x="174" y="382" text-anchor="middle" font-size="11.5" fill="#d1fae5">Leave · Working hours · Benefits</text>
  <text x="174" y="398" text-anchor="middle" font-size="11.5" fill="#d1fae5">Remote work · Resignation</text>

  <!-- ── COMPANY INFO AGENT ── -->
  <rect x="400" y="318" width="252" height="92" rx="14" fill="url(#companyGrad)" filter="url(#shadow)" />
  <text x="526" y="342" text-anchor="middle" font-size="11" font-weight="600" fill="#fde68a" letter-spacing="1.2">SPECIALIST</text>
  <text x="526" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Company Info Agent</text>
  <text x="526" y="382" text-anchor="middle" font-size="11.5" fill="#fef3c7">Mission · Products · Teams</text>
  <text x="526" y="398" text-anchor="middle" font-size="11.5" fill="#fef3c7">Offices · Leadership</text>

  <!-- Arrow left agent → merge point -->
  <line x1="174" y1="410" x2="174" y2="444" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5,3" />
  <line x1="174" y1="444" x2="350" y2="444" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5,3" />

  <!-- Arrow right agent → merge point -->
  <line x1="526" y1="410" x2="526" y2="444" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" />
  <line x1="526" y1="444" x2="350" y2="444" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" />

  <!-- Merge → Answer arrow -->
  <line x1="350" y1="444" x2="350" y2="462" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrowIndigo)" />

  <!-- ── ANSWER TO USER ── -->
  <rect x="220" y="466" width="260" height="38" rx="10" fill="url(#answerGrad)" filter="url(#shadow)" />
  <text x="350" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Answer Returned to User</text>

  <!-- Document icons on agents -->
  <!-- HR doc icon -->
  <rect x="64" y="336" width="18" height="22" rx="3" fill="#ffffff" opacity="0.25" />
  <line x1="68" y1="342" x2="78" y2="342" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  <line x1="68" y1="347" x2="78" y2="347" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  <line x1="68" y1="352" x2="74" y2="352" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />

  <!-- Company doc icon -->
  <rect x="416" y="336" width="18" height="22" rx="3" fill="#ffffff" opacity="0.25" />
  <line x1="420" y1="342" x2="430" y2="342" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  <line x1="420" y1="347" x2="430" y2="347" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  <line x1="420" y1="352" x2="426" y2="352" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
</svg>
